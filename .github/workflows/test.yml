name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every combination runs to the end, so one failure does not hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.25.x is the minimum version in go.mod.
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
